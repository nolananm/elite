<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement Réussi - Élite</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #07080b; color: white; font-family: 'Poppins', sans-serif; text-align: center; padding-top: 150px; }
        h1 { color: #00e676; }
    </style>
</head>
<body>

    <h1>Paiement validé ! 🎉</h1>
    <p>Ne quitte pas cette page, activation de ton abonnement en cours...</p>

    <script>
        const supabaseUrl = 'https://dmfbjpotgicqpfxlsycv.supabase.co';
        // Ta clé publique ANONYMOUS
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRtZmJqcG90Z2ljcXBmeGxzeWN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NDIyNjYsImV4cCI6MjEwMzMxODI2Nn0.WbVuFOdEEaWGSrn3hb8hHLi9Tvzw8AHotc42Q7XH1JE';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        async function activerAbonnement() {
            // 1. On attrape le paramètre dans l'URL (ex: ?plan=premium)
            const urlParams = new URLSearchParams(window.location.search);
            let planPaye = urlParams.get('plan');

            // 2. Sécurité : si l'URL ne contient ni classic ni premium, on bloque.
            if (planPaye !== 'classic' && planPaye !== 'premium') {
                alert("Erreur : Plan non reconnu.");
                window.location.href = 'index.html';
                return;
            }

            const { data: { user } } = await supabaseClient.auth.getUser();

            if (user) {
                // 3. On met à jour avec la variable planPaye (classic ou premium)
                const { error } = await supabaseClient
                    .from('profils')
                    .update({ plan: planPaye }) 
                    .eq('id', user.id);

                if (!error) {
                    window.location.href = 'compte.html';
                } else {
                    alert("Erreur lors de l'activation : " + error.message);
                }
            } else {
                window.location.href = 'index.html';
            }
        }

        activerAbonnement();
    </script>
</body>
</html>
