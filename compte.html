<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Compte - Élite</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-dark: #07080b; --bg-card: #12151c; --accent: #e50046; --text-main: #ffffff; --text-muted: #8b92a5; --gradient: linear-gradient(135deg, #e50046, #8000ff); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        a { text-decoration: none; color: inherit; }

        header { width: 100%; padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; background: rgba(7, 8, 11, 0.95); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .logo { font-size: 28px; font-weight: 800; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 2px; }
        nav { display: flex; gap: 30px; }
        nav a { font-weight: 600; font-size: 14px; text-transform: uppercase; transition: color 0.3s; }
        nav a:hover { color: var(--accent); }

        .container { max-width: 600px; width: 100%; margin: 80px auto; padding: 40px; background: var(--bg-card); border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 15px 35px rgba(0,0,0,0.5); text-align: center; }
        
        h1 { font-size: 32px; font-weight: 800; margin-bottom: 30px; text-transform: uppercase; }
        
        .info-group { margin-bottom: 25px; text-align: left; background: rgba(255,255,255,0.02); padding: 20px; border-radius: 10px; }
        .info-group label { display: block; font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .info-group p { font-size: 18px; font-weight: 600; }
        .plan-badge { display: inline-block; padding: 5px 15px; background: var(--gradient); border-radius: 20px; font-size: 14px; font-weight: 800; text-transform: uppercase; margin-top: 5px; }

        /* Styles spécifiques à la gestion d'abonnement */
        .gestion-abonnement { background: rgba(255,255,255,0.03); padding: 25px; border-radius: 10px; margin-top: 30px; border: 1px solid rgba(255,255,255,0.1); text-align: left; }
        .gestion-abonnement h3 { font-size: 18px; margin-bottom: 15px; }
        .notif-zone { display: none; padding: 15px; margin-bottom: 15px; border-radius: 8px; font-weight: bold; font-size: 14px; line-height: 1.5; }
        .btn-action { width: 100%; padding: 12px; font-weight: 800; border-radius: 8px; cursor: pointer; transition: 0.3s; text-transform: uppercase; margin-top: 10px; display: none; border: none; }
        .btn-resilier { background: #e50046; color: white; }
        .btn-resilier:hover { background: #ff004f; }
        .btn-secours { background: #2c313f; color: white; }
        .btn-secours:hover { background: #3a4152; }

        .btn-logout { width: 100%; padding: 15px; background: transparent; color: var(--text-muted); font-weight: 600; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; transition: 0.3s; margin-top: 30px; }
        .btn-logout:hover { background: rgba(255,255,255,0.05); color: white; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">ÉLITE</a>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="articles.html">Articles</a>
        </nav>
    </header>

    <div class="container">
        <h1>Mon Espace</h1>
        
        <div class="info-group">
            <label>Adresse Email</label>
            <p id="user-email">Chargement...</p>
        </div>

        <div class="info-group">
            <label>Statut de l'abonnement</label>
            <div id="user-plan" class="plan-badge" style="background: #333;">...</div>
        </div>

        <!-- ZONE DE GESTION D'ABONNEMENT HYBRIDE -->
        <div class="gestion-abonnement">
            <h3>Gestion de mon abonnement</h3>
            
            <div id="notif-resiliation" class="notif-zone"></div>

            <button id="btn-demander-resiliation" class="btn-action btn-resilier" onclick="lancerResiliation()">
                Résilier mon abonnement
            </button>

            <!-- REMPLACE LE LIEN CI-DESSOUS PAR TON LIEN DE PORTAIL STRIPE -->
            <button id="btn-portail-stripe" class="btn-action btn-secours" onclick="window.open('https://billing.stripe.com/p/login/14A5kC1SheK6ctc5MqgQE00', '_blank')">
                Accéder au portail d'annulation d'urgence
            </button>
        </div>

        <button class="btn-logout" onclick="seDeconnecter()">Se déconnecter</button>
    </div>

    <script>
        const supabaseUrl = 'https://dmfbjpotgicqpfxlsycv.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRtZmJqcG90Z2ljcXBmeGxzeWN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NDIyNjYsImV4cCI6MjEwMzMxODI2Nn0.WbVuFOdEEaWGSrn3hb8hHLi9Tvzw8AHotc42Q7XH1JE';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        async function initialiserCompte() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            
            if (!user) {
                // Redirige vers l'accueil si la personne n'est pas connectée
                window.location.href = 'index.html';
                return;
            }

            // Affiche l'email
            document.getElementById('user-email').innerText = user.email;

            // Récupère les infos complètes de l'utilisateur dans la table profils
            const { data: profil, error } = await supabaseClient
                .from('profils')
                .select('*')
                .eq('id', user.id)
                .single();

            if (profil) {
                // Affiche le niveau d'abonnement
                const planActuel = profil.plan ? profil.plan.toUpperCase() : 'FREE';
                const badgePlan = document.getElementById('user-plan');
                badgePlan.innerText = planActuel;
                
                if(planActuel === 'PREMIUM') badgePlan.style.background = 'var(--gradient)';
                else if(planActuel === 'CLASSIC') badgePlan.style.background = '#0055ff';
                else badgePlan.style.background = '#333';

                // Lance le moteur de vérification pour la résiliation
                gererInterfaceResiliation(profil);
            }
        }

        function gererInterfaceResiliation(profil) {
            const btnDemander = document.getElementById('btn-demander-resiliation');
            const btnPortail = document.getElementById('btn-portail-stripe');
            const notifZone = document.getElementById('notif-resiliation');

            // 1. Abonné normal sans demande en cours -> On affiche juste le bouton rouge
            if (profil.plan !== 'free' && (!profil.statut_resiliation || profil.statut_resiliation === 'aucun')) {
                btnDemander.style.display = 'block';
            }

            // 2. Demande envoyée et en attente de traitement par l'admin
            if (profil.statut_resiliation === 'en_attente') {
                notifZone.style.display = 'block';
                notifZone.style.background = 'rgba(255, 165, 0, 0.15)'; 
                notifZone.style.color = '#ffa500';
                
                // Calcul des 48h
                const dateDemande = new Date(profil.date_demande_resiliation);
                const maintenant = new Date();
                const heuresEcoulees = Math.abs(maintenant - dateDemande) / 36e5;

                if (heuresEcoulees >= 48) {
                    notifZone.innerHTML = "Le délai de traitement de 48h est dépassé. Vous pouvez annuler votre abonnement instantanément et manuellement via notre portail de secours sécurisé.";
                    btnPortail.style.display = 'block';
                } else {
                    notifZone.innerHTML = "Votre demande de résiliation a bien été prise en compte. Elle sera traitée par notre équipe sous 48h maximum. Vos accès restent actifs jusqu'à la fin de la période payée.";
                }
            }

            // 3. Demande traitée par l'admin
            if (profil.statut_resiliation === 'traitee') {
                notifZone.style.display = 'block';
                notifZone.style.background = 'rgba(0, 230, 118, 0.15)'; 
                notifZone.style.color = '#00e676';
                notifZone.innerHTML = "Votre abonnement a été résilié par notre équipe. Il se terminera définitivement à la fin de votre période de facturation en cours.";
            }
        }

        async function lancerResiliation() {
            const confirmation = confirm("Êtes-vous sûr de vouloir résilier votre abonnement ? Votre demande sera envoyée à notre équipe.");
            if (!confirmation) return;

            const { data: { user } } = await supabaseClient.auth.getUser();

            // Met à jour la base de données avec l'heure exacte et le statut "en_attente"
            const { error } = await supabaseClient
                .from('profils')
                .update({ 
                    statut_resiliation: 'en_attente',
                    date_demande_resiliation: new Date().toISOString()
                })
                .eq('id', user.id);

            if (!error) {
                alert("Votre demande de résiliation a été envoyée avec succès.");
                location.reload(); // Recharge la page pour afficher la nouvelle interface
            } else {
                alert("Une erreur est survenue lors de l'envoi de la demande. Veuillez réessayer.");
            }
        }

        async function seDeconnecter() {
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        }

        // Exécute la fonction au chargement de la page
        initialiserCompte();
    </script>
</body>
</html>
