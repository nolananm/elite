<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Compte - Élite</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-dark: #07080b; --bg-card: #12151c; --accent: #e50046; --text-main: #ffffff; --text-muted: #8b92a5; --gradient: linear-gradient(135deg, #e50046, #8000ff); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: radial-gradient(circle at top left, rgba(229, 0, 70, 0.1), transparent 50%), var(--bg-dark); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }
        a { text-decoration: none; color: inherit; }

        header { position: fixed; top: 0; width: 100%; padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; background: rgba(7, 8, 11, 0.95); z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .logo { font-size: 28px; font-weight: 800; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 2px; }
        nav { display: flex; gap: 30px; align-items: center; }
        nav a { font-weight: 600; font-size: 14px; text-transform: uppercase; transition: color 0.3s; }
        nav a:hover { color: var(--accent); }

        .container { max-width: 600px; margin: 150px auto 50px auto; padding: 0 20px; }
        
        .box { background: var(--bg-card); border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); padding: 40px; text-align: center; }
        .box h2 { font-size: 32px; font-weight: 800; margin-bottom: 30px; text-transform: uppercase; }

        .form-group { text-align: left; margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; }
        .form-group input { width: 100%; padding: 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: white; font-family: 'Poppins', sans-serif; font-size: 15px; outline: none; transition: 0.3s; }
        .form-group input:focus { border-color: var(--accent); background: rgba(255,255,255,0.08); }

        .btn { width: 100%; padding: 15px; color: white; font-weight: 800; border-radius: 8px; text-transform: uppercase; border: none; cursor: pointer; transition: 0.3s; margin-bottom: 15px; font-size: 16px; }
        .btn.primary { background: var(--gradient); box-shadow: 0 10px 20px rgba(229,0,70,0.3); }
        .btn.primary:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(229,0,70,0.4); }
        .btn.secondary { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); }
        .btn.secondary:hover { background: rgba(255,255,255,0.1); }
        
        .btn.danger { background: rgba(255,50,50,0.1); color: #ff4444; border: 1px solid rgba(255,50,50,0.2); margin-top: 20px; }
        .btn.danger:hover { background: rgba(255,50,50,0.2); }

        .btn.stripe-btn { background: #635bff; color: white; box-shadow: 0 10px 20px rgba(99,91,255,0.3); margin-top: 30px; }
        .btn.stripe-btn:hover { background: #5851df; transform: translateY(-2px); box-shadow: 0 15px 30px rgba(99,91,255,0.4); }

        .toggle-link { color: var(--accent); font-size: 14px; cursor: pointer; font-weight: 600; text-decoration: underline; }
        
        .status-badge { display: inline-block; padding: 8px 20px; font-size: 14px; font-weight: 800; text-transform: uppercase; border-radius: 8px; margin: 20px 0; letter-spacing: 1px; }
        .status-free { background: #222; border: 1px solid rgba(255,255,255,0.2); }
        .status-classic { background: #0055ff; color: white; }
        .status-premium { background: var(--gradient); color: white; box-shadow: 0 10px 20px rgba(229,0,70,0.3); }

        #dashboard-section, #auth-section { display: none; }

        @media (max-width: 768px) {
            header { flex-direction: column; padding: 15px; gap: 10px; }
            nav { flex-wrap: wrap; justify-content: center; gap: 10px; }
            .container { margin-top: 140px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">ÉLITE</a>
        <nav>
            <a href="articles.html">Articles</a>
            <a href="matchs.html">Matchs & Fan Zone</a>
            <a href="medias.html">Émissions & Podcasts</a>
            <a href="compte.html" style="color: var(--accent);">Compte</a>
        </nav>
    </header>

    <div class="container">
        
        <!-- SECTION AUTHENTIFICATION (Si non connecté) -->
        <div class="box" id="auth-section">
            <h2 id="auth-title">Connexion</h2>
            
            <div class="form-group">
                <label>Adresse Email</label>
                <input type="email" id="email" placeholder="jean@exemple.com">
            </div>
            
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>

            <button class="btn primary" id="auth-btn" onclick="gererAuth()">Se connecter</button>
            <p style="color: var(--text-muted); font-size: 14px; margin-top: 15px;">
                <span id="auth-toggle-text">Pas encore de compte ?</span> 
                <span class="toggle-link" onclick="toggleAuthMode()">Créer un compte</span>
            </p>
        </div>

        <!-- SECTION DASHBOARD (Si connecté) -->
        <div class="box" id="dashboard-section">
            <h2>Mon Profil</h2>
            <p style="color: var(--text-muted); font-size: 16px; margin-bottom: 5px;">Connecté en tant que :</p>
            <h3 id="user-email" style="font-size: 20px; font-weight: 600;">...</h3>
            
            <div style="margin: 30px 0; padding: 20px; background: rgba(0,0,0,0.5); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);">
                <p style="color: var(--text-muted); font-size: 14px; text-transform: uppercase; font-weight: 800;">Niveau d'Abonnement</p>
                <div id="plan-badge" class="status-badge status-free">Chargement...</div>
                <p id="plan-desc" style="font-size: 14px; color: var(--text-muted);">...</p>
            </div>

            <!-- BOUTON POUR GERER L'ABONNEMENT SUR STRIPE -->
            <button class="btn stripe-btn" onclick="gererAbonnementStripe()">Gérer mon abonnement (Factures / Résiliation)</button>
            
            <button class="btn secondary" style="margin-top: 15px;" onclick="window.location.href='index.html#abonnements'">Voir les offres</button>
            <button class="btn danger" onclick="seDeconnecter()">Se déconnecter</button>
        </div>

    </div>

    <script>
        const supabaseUrl = 'https://dmfbjpotgicqpfxlsycv.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRtZmJqcG90Z2ljcXBmeGxzeWN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NDIyNjYsImV4cCI6MjEwMzMxODI2Nn0.WbVuFOdEEaWGSrn3hb8hHLi9Tvzw8AHotc42Q7XH1JE';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let isLoginMode = true;

        // 🚨 REMPLACE CE LIEN PAR LE LIEN DU PORTAIL CLIENT STRIPE (À générer dans Stripe > Portail client) 🚨
        const LIEN_PORTAIL_STRIPE = "https://billing.stripe.com/p/login/14A5kC1SheK6ctc5MqgQE00";

        async function verifierSession() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            
            if (user) {
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('dashboard-section').style.display = 'block';
                document.getElementById('user-email').innerText = user.email;

                // Récupération du plan
                const { data: profil } = await supabaseClient.from('profils').select('plan').eq('id', user.id).single();
                let plan = profil ? profil.plan : 'free';
                
                let badge = document.getElementById('plan-badge');
                let desc = document.getElementById('plan-desc');
                
                badge.className = `status-badge status-${plan}`;
                badge.innerText = plan.toUpperCase();

                if(plan === 'premium') desc.innerText = "Accès total débloqué. Merci pour votre soutien !";
                else if (plan === 'classic') desc.innerText = "Vous avez accès aux articles et podcasts complets.";
                else desc.innerText = "Vous utilisez la version gratuite restreinte.";

            } else {
                document.getElementById('auth-section').style.display = 'block';
                document.getElementById('dashboard-section').style.display = 'none';
            }
        }

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').innerText = isLoginMode ? "Connexion" : "Inscription";
            document.getElementById('auth-btn').innerText = isLoginMode ? "Se connecter" : "Créer mon compte";
            document.getElementById('auth-toggle-text').innerText = isLoginMode ? "Pas encore de compte ?" : "Déjà un compte ?";
            document.querySelector('.toggle-link').innerText = isLoginMode ? "Créer un compte" : "Se connecter";
        }

        async function gererAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) { alert("Remplissez tous les champs !"); return; }

            const btn = document.getElementById('auth-btn');
            btn.innerText = "Patientez...";

            if (isLoginMode) {
                const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) alert("Erreur : " + error.message);
                else { window.location.reload(); }
            } else {
                const { error } = await supabaseClient.auth.signUp({ email, password });
                if (error) alert("Erreur : " + error.message);
                else { alert("Compte créé avec succès ! Tu peux maintenant te connecter."); toggleAuthMode(); }
            }
            btn.innerText = isLoginMode ? "Se connecter" : "Créer mon compte";
        }

        async function seDeconnecter() {
            await supabaseClient.auth.signOut();
            window.location.reload();
        }

        function gererAbonnementStripe() {
            window.location.href = LIEN_PORTAIL_STRIPE;
        }

        verifierSession();
        <!-- ZONE DE GESTION D'ABONNEMENT -->
<div class="gestion-abonnement" style="background: #12151c; padding: 20px; border-radius: 10px; margin-top: 20px; border: 1px solid rgba(255,255,255,0.1);">
    <h3>Gestion de mon abonnement</h3>
    
    <!-- Zone de notification (cachée par défaut) -->
    <div id="notif-resiliation" style="display: none; padding: 15px; margin: 15px 0; border-radius: 8px; font-weight: bold;">
        <!-- Le texte changera via Javascript -->
    </div>

    <!-- Le bouton de demande initiale -->
    <button id="btn-demander-resiliation" onclick="lancerResiliation()" style="display: none; background: #e50046; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">
        Résilier mon abonnement
    </button>

    <!-- Le bouton de secours Stripe (caché par défaut) -->
    <button id="btn-portail-stripe" onclick="window.open('TON_LIEN_PORTAIL_STRIPE_ICI', '_blank')" style="display: none; background: #8b92a5; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px;">
        Accéder au portail d'annulation d'urgence
    </button>
</div>
    </script>
</body>
</html>
