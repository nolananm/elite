<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Compte - Élite</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-card: #151821;
            --accent: #e50046;
            --text-main: #ffffff;
            --text-muted: #9ba1a6;
            --gradient: linear-gradient(135deg, #e50046, #8000ff);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        /* FOND DOUX ET REPOSANT */
        body { 
            background: radial-gradient(circle at center, #151821 0%, #0a0b10 100%);
            color: var(--text-main); 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            flex-direction: column;
        }

        .logo-top { font-size: 40px; font-weight: 800; margin-bottom: 25px; color: white; letter-spacing: 2px; text-decoration: none; text-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        /* BOÎTE AVEC LÉGER HALO LUMINEUX */
        .auth-box { 
            background: var(--bg-card); 
            padding: 40px; 
            border-radius: 20px; 
            width: 100%; 
            max-width: 450px; 
            border: 1px solid rgba(255,255,255,0.05); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 20px rgba(229, 0, 70, 0.1);
            animation: fadeUp 0.6s ease-out forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tabs { display: flex; margin-bottom: 30px; border-bottom: 2px solid rgba(255,255,255,0.1); }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; color: var(--text-muted); font-weight: 600; transition: 0.3s; position: relative; }
        .tab:hover { color: white; }
        .tab.active { color: white; }
        .tab.active::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 100%; height: 2px; background: var(--accent); border-radius: 2px; }

        input { width: 100%; padding: 15px; margin-bottom: 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 8px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--accent); background: rgba(255,255,255,0.1); }

        .btn-action { width: 100%; padding: 15px; border: none; border-radius: 8px; background: var(--gradient); color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-action:hover { box-shadow: 0 5px 20px rgba(229, 0, 70, 0.5); transform: translateY(-2px); }

        .btn-logout { background: rgba(255,255,255,0.1); color: white; margin-top: 20px; }
        .btn-logout:hover { background: rgba(255,255,255,0.2); box-shadow: none; }

        #auth-message { text-align: center; font-size: 14px; margin-top: 15px; min-height: 20px; }
        .msg-error { color: #ff4d4d; }
        .msg-success { color: #00e676; }

        #section-compte { text-align: center; }
        #section-compte h3 { font-size: 24px; margin-bottom: 10px; }
        .plan-badge { display: inline-block; padding: 8px 20px; background: var(--gradient); color: white; border-radius: 30px; font-size: 14px; font-weight: bold; margin: 20px 0; letter-spacing: 1px; }
        
        .retour-accueil { margin-top: 25px; color: rgba(255,255,255,0.5); font-size: 14px; text-decoration: none; transition: 0.3s; }
        .retour-accueil:hover { color: white; }
    </style>
</head>
<body>

    <a href="index.html" class="logo-top">ÉLITE</a>

    <div class="auth-box">
        <div id="section-auth">
            <div class="tabs">
                <div class="tab active" id="tab-login" onclick="changerMode('login')">Se connecter</div>
                <div class="tab" id="tab-register" onclick="changerMode('register')">S'inscrire</div>
            </div>

            <input type="email" id="email" placeholder="Adresse e-mail">
            <input type="password" id="password" placeholder="Mot de passe">
            
            <button class="btn-action" id="btn-submit" onclick="soumettre()">Connexion</button>
            <p id="auth-message"></p>
        </div>

        <div id="section-compte" style="display: none;">
            <h3>Ton Profil Élite</h3>
            <p style="color: var(--text-muted);">Voici ton abonnement actuel :</p>
            <div class="plan-badge" id="plan-display">Chargement...</div>
            <button class="btn-action btn-logout" onclick="deconnexion()">Se déconnecter</button>
        </div>
    </div>

    <a href="index.html" class="retour-accueil">← Retour à l'accueil</a>

    <script>
        const supabaseUrl = 'https://dmfbjpotgicqpfxlsycv.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRtZmJqcG90Z2ljcXBmeGxzeWN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NDIyNjYsImV4cCI6MjEwMzMxODI2Nn0.WbVuFOdEEaWGSrn3hb8hHLi9Tvzw8AHotc42Q7XH1JE';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let modeActuel = 'login';
        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');
        const btnSubmit = document.getElementById('btn-submit');
        const message = document.getElementById('auth-message');

        function changerMode(mode) {
            modeActuel = mode;
            message.textContent = "";
            message.className = "";
            document.getElementById('email').value = "";
            document.getElementById('password').value = "";

            if (mode === 'login') {
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
                btnSubmit.textContent = "Connexion";
            } else {
                tabRegister.classList.add('active');
                tabLogin.classList.remove('active');
                btnSubmit.textContent = "Créer mon compte";
            }
        }

        function soumettre() {
            if (modeActuel === 'login') {
                connexion();
            } else {
                inscription();
            }
        }

        async function inscription() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            message.textContent = "Création du compte...";
            message.className = "";
            
            const { data, error } = await supabaseClient.auth.signUp({ email, password });
            
            if (error) {
                message.className = "msg-error";
                message.textContent = "❌ " + error.message;
            } else {
                const { data: { user } } = await supabaseClient.auth.getUser();
                if (user) {
                    window.location.href = 'index.html';
                } else {
                    message.className = "msg-success";
                    message.textContent = "✅ Compte créé ! Connecte-toi.";
                    changerMode('login');
                }
            }
        }

        async function connexion() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            message.textContent = "Connexion en cours...";
            message.className = "";
            
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            
            if (error) {
                message.className = "msg-error";
                message.textContent = "❌ Identifiants incorrects.";
            } else {
                window.location.href = 'index.html';
            }
        }

        async function deconnexion() {
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        }

        async function verifierSession() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            const sectionAuth = document.getElementById('section-auth');
            const sectionCompte = document.getElementById('section-compte');
            const planDisplay = document.getElementById('plan-display');
            
            if (user) {
                sectionAuth.style.display = "none";
                sectionCompte.style.display = "block";
                
                const { data: profil } = await supabaseClient.from('profils').select('plan').eq('id', user.id).single();
                if (profil) { planDisplay.textContent = "ÉLITE " + profil.plan.toUpperCase(); }
            } else {
                sectionAuth.style.display = "block";
                sectionCompte.style.display = "none";
            }
        }

        verifierSession();
    </script>
</body>
</html>
