    <script>
        const supabaseUrl = 'https://dmfbjpotgicqpfxlsycv.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRtZmJqcG90Z2ljcXBmeGxzeWN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NDIyNjYsImV4cCI6MjEwMzMxODI2Nn0.WbVuFOdEEaWGSrn3hb8hHLi9Tvzw8AHotc42Q7XH1JE';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let profilActuel = 'none'; 
        let tousLesMedias = [];
        
        // --- SYSTÈME RADIO & EXTRAIT GRATUIT (1 MINUTE) ---
        let isPreviewMode = false;
        let videoPreviewTimer = null;
        
        // Jingle ultra fiable hébergé par Google (Son électronique "Swoosh" de 3 secondes)
        // 💡 CONSEIL : Héberge ton propre jingle sur ton Supabase (bucket medias) et remplace ce lien 💡
        const URL_JINGLE = 'https://actions.google.com/sounds/v1/science_fiction/sci_fi_sweeper_effect.ogg'; 
        
        let audioJingle = new Audio(URL_JINGLE);
        audioJingle.preload = 'auto';
        audioJingle.volume = 0.25; 
        
        let audioPodcast = new Audio();
        audioPodcast.preload = 'auto';
        audioPodcast.volume = 1.0; 
        
        let isAudioPlaying = false;
        let isJinglePhase = true;
        let transitionTriggered = false;
        let fadeInterval = null;
        
        let jingleDuration = 3.0; // Durée approximative du Jingle
        let podcastDuration = 0;

        audioJingle.addEventListener('loadedmetadata', () => { 
            if(audioJingle.duration > 0) jingleDuration = audioJingle.duration;
        });

        audioPodcast.addEventListener('loadedmetadata', () => { 
            // Si c'est un extrait gratuit, on fait croire au lecteur que le fichier ne fait que 60 secondes !
            podcastDuration = isPreviewMode ? Math.min(audioPodcast.duration, 60) : audioPodcast.duration; 
            updateTotalTimeUI(); 
        });

        // Sécurité anti-bug
        audioJingle.onerror = () => { jingleDuration = 0; isJinglePhase = false; };

        // Fondu enchaîné (Crossfade)
        function triggerCrossfade() {
            if(transitionTriggered) return;
            transitionTriggered = true;
            isJinglePhase = false;
            
            audioPodcast.play().catch(e => console.log("Attente interaction"));
            
            clearInterval(fadeInterval);
            fadeInterval = setInterval(() => {
                if (audioJingle.volume > 0.02) {
                    audioJingle.volume -= 0.02;
                } else {
                    clearInterval(fadeInterval);
                    audioJingle.pause();
                    audioJingle.volume = 0.25; 
                }
            }, 100);
        }

        audioJingle.addEventListener('timeupdate', () => { 
            if(isJinglePhase) {
                updateProgressUI(audioJingle.currentTime); 
                // Déclenchement du fondu 1s avant la fin du jingle
                if (audioJingle.currentTime >= (jingleDuration - 1.0)) { triggerCrossfade(); }
            }
        });

        // 🚨 GESTION DE LA MINUTE GRATUITE (Podcast) 🚨
        audioPodcast.addEventListener('timeupdate', () => { 
            if(!isJinglePhase) {
                if (isPreviewMode && audioPodcast.currentTime >= 60) {
                    // Les 60 secondes sont écoulées ! On coupe TOUT.
                    audioPodcast.pause();
                    isAudioPlaying = false;
                    document.getElementById('play-pause-btn').innerText = '▶';
                    document.getElementById('audio-wave-icon').classList.remove('playing');
                    
                    fermerMedia();
                    afficherPaywall("Fin de l'extrait", "Abonnez-vous pour écouter l'intégralité de cette émission !");
                    return;
                }
                
                updateProgressUI(jingleDuration + audioPodcast.currentTime); 
            }
        });
        
        audioJingle.addEventListener('ended', () => { if(!transitionTriggered) triggerCrossfade(); });

        audioPodcast.addEventListener('ended', () => {
            isAudioPlaying = false;
            document.getElementById('play-pause-btn').innerText = '▶';
            document.getElementById('audio-wave-icon').classList.remove('playing');
        });

        function toggleAudioPlay() {
            if (isAudioPlaying) {
                if(isJinglePhase) audioJingle.pause(); else audioPodcast.pause();
                document.getElementById('play-pause-btn').innerText = '▶';
                document.getElementById('audio-wave-icon').classList.remove('playing');
                isAudioPlaying = false;
            } else {
                if(isJinglePhase && jingleDuration > 0) {
                    audioJingle.play().catch(() => triggerCrossfade());
                } else {
                    audioPodcast.play();
                }
                document.getElementById('play-pause-btn').innerText = '⏸';
                document.getElementById('audio-wave-icon').classList.add('playing');
                isAudioPlaying = true;
            }
        }

        function updateProgressUI(currentTime) {
            let total = jingleDuration + podcastDuration;
            if (total === 0 || isNaN(total)) return;
            let percent = (currentTime / total) * 100;
            document.getElementById('audio-progress').style.width = percent + '%';
            document.getElementById('time-current').innerText = formatTime(currentTime);
        }

        function updateTotalTimeUI() {
            let total = jingleDuration + podcastDuration;
            if(!isNaN(total) && total > jingleDuration) {
                document.getElementById('time-total').innerText = formatTime(total);
            }
        }

        function seekAudio(e) {
            let track = document.getElementById('audio-track');
            let rect = track.getBoundingClientRect();
            let clickX = e.clientX - rect.left;
            let percent = clickX / rect.width;
            
            let total = jingleDuration + podcastDuration;
            let targetTime = percent * total;

            // 🚨 EMPÊCHER LE VISITEUR GRATUIT D'AVANCER APRÈS 60 SECONDES 🚨
            if (isPreviewMode && (targetTime - jingleDuration) >= 60) {
                fermerMedia();
                afficherPaywall("Fin de l'extrait", "Vous ne pouvez pas avancer plus loin. Abonnez-vous pour tout écouter !");
                return;
            }

            clearInterval(fadeInterval); 

            if (targetTime < jingleDuration && jingleDuration > 0) {
                isJinglePhase = true;
                transitionTriggered = false;
                audioPodcast.pause();
                audioPodcast.currentTime = 0;
                audioJingle.volume = 0.25; 
                audioJingle.currentTime = targetTime;
                if(isAudioPlaying) audioJingle.play();
            } else {
                isJinglePhase = false;
                transitionTriggered = true;
                audioJingle.pause();
                audioPodcast.currentTime = targetTime - jingleDuration;
                if(isAudioPlaying) audioPodcast.play();
            }
            updateProgressUI(targetTime);
        }

        function formatTime(seconds) {
            if(isNaN(seconds)) return "00:00";
            let m = Math.floor(seconds / 60);
            let s = Math.floor(seconds % 60);
            return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
        }

            document.getElementById('paywall-title').innerHTML = titre;
            document.getElementById('paywall-message').innerText = message;
            const modal = document.getElementById('modal-paywall'); 
            modal.style.display = 'flex'; 
            setTimeout(() => { modal.classList.add('show'); }, 10);
        }

        function fermerModalPaywall() {
            const modal = document.getElementById('modal-paywall');
            modal.classList.remove('show');
            setTimeout(() => { modal.style.display = 'none'; }, 300);
        }
        // --- FIN LOGIQUE AUDIO ---

                    <div class="media-content">
                        <div class="media-type">${libelleType}</div>
                        <div class="media-title">${m.titre}</div>
                        <div class="media-desc">${m.description || ''}</div>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        function ouvrirMedia(idMedia) {
            const media = tousLesMedias.find(m => m.id == idMedia);
            if (!media) return;

            const accesRequis = media.niveau_acces || 'free';
            let aLeDroit = false;
            if (accesRequis === 'free') aLeDroit = true;
            else if (accesRequis === 'classic' && (profilActuel === 'classic' || profilActuel === 'premium')) aLeDroit = true;
            else if (accesRequis === 'premium' && profilActuel === 'premium') aLeDroit = true;

            // DÉCLENCHEMENT DU MODE EXTRAIT GRATUIT 
            isPreviewMode = !aLeDroit;

            if (media.type_media === 'video') {
                let embedUrl = media.url_media.replace("watch?v=", "embed/").replace("youtu.be/", "www.youtube.com/embed/");
                
                let badgePreview = isPreviewMode ? `<div style="background:var(--accent); color:white; text-align:center; padding:8px; font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:1px;">⏳ Extrait gratuit de 1 minute</div>` : '';
                
                document.getElementById('video-content').innerHTML = `
                    ${badgePreview}
                    <div class="video-container"><iframe src="${embedUrl}?autoplay=1" allow="autoplay; fullscreen"></iframe></div>
                `;
                
                const modal = document.getElementById('modal-video'); modal.style.display = 'flex'; setTimeout(() => { modal.classList.add('show'); }, 10);
                
                // COUPE LA VIDÉO AU BOUT DE 60 SECONDES
                if (isPreviewMode) {
                    videoPreviewTimer = setTimeout(() => {
                        fermerMedia();
                        afficherPaywall("Fin de l'extrait", "Abonnez-vous pour voir l'intégralité de cette vidéo !");
                    }, 60000);
                }

            } 
            else if (media.type_media === 'podcast') {
                document.getElementById('audio-title').innerText = isPreviewMode ? "⏳ Extrait (1 min) - " + media.titre : media.titre;
                
                audioPodcast.src = media.url_media;
                isAudioPlaying = false;
                transitionTriggered = false;
                clearInterval(fadeInterval);
                
                isJinglePhase = (jingleDuration > 0);
                if (isJinglePhase) {
                    try { audioJingle.currentTime = 0; audioJingle.volume = 0.25; } catch(e) {}
                }
                
                document.getElementById('audio-progress').style.width = '0%';
                document.getElementById('time-current').innerText = "00:00";
                document.getElementById('play-pause-btn').innerText = '▶';
                
                const modal = document.getElementById('modal-audio'); modal.style.display = 'flex'; setTimeout(() => { modal.classList.add('show'); }, 10);
            }
        }

        function fermerMedia() {
            if (videoPreviewTimer) clearTimeout(videoPreviewTimer); // Stop le minuteur vidéo

            document.querySelectorAll('.site-modal').forEach(m => {
                if (m.id !== 'modal-paywall') {
                    m.classList.remove('show');
                    setTimeout(() => { m.style.display = 'none'; }, 300);
                }
            });
            document.getElementById('video-content').innerHTML = '';
            
            clearInterval(fadeInterval);
            audioJingle.pause();
            audioPodcast.pause();
            isAudioPlaying = false;
            document.getElementById('audio-wave-icon').classList.remove('playing');
        }

        initialiserPage();
    </script>
</body>
</html>
