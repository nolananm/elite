<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Émissions & Podcasts - Élite</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        :root { --bg-dark: #07080b; --bg-card: #12151c; --accent: #e50046; --text-main: #ffffff; --text-muted: #8b92a5; --gradient: linear-gradient(135deg, #e50046, #8000ff); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); overflow-x: hidden; min-height: 100vh; }
        a { text-decoration: none; color: inherit; }

        header { position: fixed; top: 0; width: 100%; padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); z-index: 1000; }
        .logo { font-size: 28px; font-weight: 800; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 2px; }
        nav { display: flex; gap: 30px; align-items: center; }
        nav a { font-weight: 600; font-size: 14px; text-transform: uppercase; transition: color 0.3s; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        nav a:hover { color: var(--accent); }

        /* HERO SECTION (Le dernier Mag) */
        .hero-banner { position: relative; width: 100%; height: 75vh; background: #000; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 80px 50px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .hero-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to top, var(--bg-dark) 0%, transparent 60%, rgba(0,0,0,0.5) 100%); pointer-events: none; z-index: 2; }
        .hero-content { position: relative; z-index: 3; max-width: 800px; }
        .badge-acces { display: inline-block; font-size: 11px; font-weight: 800; padding: 6px 14px; border-radius: 4px; text-transform: uppercase; margin-bottom: 15px; letter-spacing: 1px; }
        .badge-classic { background: #0055ff; color: white; }
        .badge-premium { background: var(--gradient); color: white; }
        .hero-title { font-size: 48px; font-weight: 800; line-height: 1.1; margin-bottom: 20px; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .hero-desc { font-size: 16px; color: #d0d4e0; line-height: 1.5; margin-bottom: 30px; text-shadow: 0 2px 5px rgba(0,0,0,0.8); }
        
        .yt-wrapper { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100vw; height: 56.25vw; min-height: 100vh; min-width: 177.77vh; z-index: 1; }
        .yt-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .yt-shield { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 4; cursor: pointer; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.2); transition: background 0.3s; }
        .yt-play-btn { background: var(--gradient); width: 90px; height: 90px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 32px; color: white; box-shadow: 0 10px 40px rgba(229,0,70,0.6); transition: transform 0.3s; padding-left: 6px; }
        .yt-shield:hover .yt-play-btn { transform: scale(1.1); }

        /* LISTE DES REPLAYS ET PODCASTS */
        .catalog-section { padding: 40px 50px; }
        .section-title { font-size: 24px; font-weight: 600; margin-bottom: 20px; color: white; display: flex; align-items: center; justify-content: space-between; }
        
        /* Scroll horizontal élégant */
        .scrolling-wrapper { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 20px; scroll-behavior: smooth; }
        .scrolling-wrapper::-webkit-scrollbar { height: 8px; }
        .scrolling-wrapper::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); border-radius: 4px; }
        .scrolling-wrapper::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
        .scrolling-wrapper::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        .thumbnail-card { flex: 0 0 320px; background: var(--bg-card); border-radius: 12px; overflow: hidden; position: relative; transition: transform 0.3s, box-shadow 0.3s; border: 1px solid rgba(255,255,255,0.05); }
        .thumbnail-card:hover { transform: scale(1.05); box-shadow: 0 15px 30px rgba(0,0,0,0.6); border-color: rgba(255,255,255,0.2); z-index: 10; }
        
        .thumb-img { width: 100%; aspect-ratio: 16/9; background-size: cover; background-position: center; position: relative; display: flex; align-items: center; justify-content: center; }
        .thumb-img::after { content: '▶'; position: absolute; font-size: 30px; color: white; opacity: 0; transition: 0.3s; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .thumbnail-card:hover .thumb-img::after { opacity: 1; transform: scale(1.2); }
        .thumb-img::before { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.3); transition: 0.3s; }
        .thumbnail-card:hover .thumb-img::before { background: rgba(0,0,0,0.1); }
        
        .thumb-info { padding: 15px; }
        .thumb-title { font-size: 15px; font-weight: 600; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* LECTEUR PODCAST (Design modernisé) */
        .podcast-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; }
        .podcast-card { display: flex; align-items: center; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 20px; transition: 0.3s; }
        .podcast-card:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1); }
        
        .pod-play-btn { background: var(--gradient); color: white; border: none; min-width: 50px; height: 50px; border-radius: 50%; font-size: 18px; margin-right: 20px; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 5px 15px rgba(229, 0, 70, 0.3); }
        .pod-content { flex: 1; }
        .pod-title { font-size: 16px; font-weight: 600; margin-bottom: 5px; }
        
        .progress-container { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
        .progress-container input[type=range] { flex: 1; -webkit-appearance: none; background: transparent; cursor: pointer; margin: 0; }
        .progress-container input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; }
        .progress-container input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 12px; width: 12px; border-radius: 50%; background: var(--accent); margin-top: -4px; }
        .time-display { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }

        .loading-text { text-align: center; color: var(--text-muted); padding: 50px; font-size: 18px; width: 100%; }

        /* MODAL (Identique) */
        #upgrade-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 7, 12, 0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); z-index: 2000; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.4s ease; }
        #upgrade-modal.show { opacity: 1; }
        .upgrade-box { background: linear-gradient(145deg, #161a25, #0f111a); padding: 50px 40px; border-radius: 24px; width: 100%; max-width: 480px; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 30px 60px rgba(0,0,0,0.8); text-align: center; position: relative; transform: scale(0.95) translateY(20px); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #upgrade-modal.show .upgrade-box { transform: scale(1) translateY(0); }
        .upgrade-content { position: relative; z-index: 1; }
        .upgrade-box h2 { font-size: 26px; margin-bottom: 15px; font-weight: 800; text-transform: uppercase; color: white; }
        .upgrade-box p { color: #a0a5b0; margin-bottom: 35px; font-size: 15px; line-height: 1.6; }
        .btn-upgrade { display: block; width: 100%; padding: 18px; background: var(--gradient); color: white; font-weight: 800; border-radius: 12px; font-size: 16px; border: none; cursor: pointer; text-decoration: none; text-transform: uppercase; }
        .btn-close { margin-top: 25px; display: inline-block; color: #707580; font-size: 13px; font-weight: 600; cursor: pointer; background: none; border: none; transition: 0.3s; text-transform: uppercase; }
        .btn-close:hover { color: white; }
        
        /* Modal pour jouer un replay YouTube */
        #replay-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1500; justify-content: center; align-items: center; }
        .replay-container { width: 90%; max-width: 1000px; aspect-ratio: 16/9; position: relative; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        .close-replay { position: absolute; top: -40px; right: 0; color: white; font-size: 30px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">ÉLITE</a>
        <nav>
            <a href="articles.html">Articles</a>
            <a href="matchs.html">Matchs & Fan Zone</a>
            <a href="medias.html" style="color: var(--accent);">Émissions & Podcasts</a>
            <a href="compte.html">Compte</a>
        </nav>
    </header>

    <!-- ZONE HERO : Le Mag le plus récent -->
    <div id="hero-container">
        <div class="hero-banner" style="height: 50vh; align-items: center; justify-content: center;">
            <div class="loading-text">Chargement du studio...</div>
        </div>
    </div>

    <!-- REPLAYS VIDÉOS -->
    <div class="catalog-section">
        <div class="section-title">Replays Élite Le Mag</div>
        <div class="scrolling-wrapper" id="replays-container">
            <!-- Vides par défaut -->
        </div>
    </div>

    <!-- PODCASTS -->
    <div class="catalog-section" style="background: rgba(255,255,255,0.01); border-top: 1px solid rgba(255,255,255,0.05);">
        <div class="section-title">Élite Décrypte <span style="font-size: 12px; background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 12px; margin-left: 15px;">Écoute en tâche de fond</span></div>
        <div class="podcast-grid" id="podcasts-container">
            <!-- Vides par défaut -->
        </div>
    </div>

    <!-- MODAL BLOQUAGE (Temps écoulé) -->
    <div id="upgrade-modal">
        <div class="upgrade-box">
            <div class="upgrade-content">
                <h2 id="upgrade-title">Abonnement Requis</h2>
                <p id="upgrade-message">Le contenu gratuit est terminé.</p>
                <a href="index.html#abonnements" class="btn-upgrade">Découvrir les offres</a>
                <button class="btn-close" onclick="fermerModal()">Fermer</button>
            </div>
        </div>
    </div>

    <!-- MODAL LECTEUR REPLAY YOUTUBE -->
    <div id="replay-modal">
        <div style="position: relative; width: 90%; max-width: 1000px;">
            <div class="close-replay" onclick="fermerReplay()">×</div>
            <div class="replay-container" id="replay-player-box" data-access="">
                <div class="yt-wrapper" style="width: 100%; height: 100%; min-width: 0; min-height: 0; top: 0; left: 0; transform: none;">
                    <div id="yt-replay"></div>
                    <div class="yt-shield" id="yt-shield-replay" onclick="toggleYouTube('replay')">
                        <div class="yt-play-btn" id="yt-play-btn-replay">▶</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://dmfbjpotgicqpfxlsycv.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRtZmJqcG90Z2ljcXBmeGxzeWN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NDIyNjYsImV4cCI6MjEwMzMxODI2Nn0.WbVuFOdEEaWGSrn3hb8hHLi9Tvzw8AHotc42Q7XH1JE';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let profilActuel = 'none'; 
        let ytPlayers = {};
        let lecteurBloqueActuel = null; 
        
        let heroVideoId = null;
        let replayVideos = [];

        function onYouTubeIframeAPIReady() {
            if (heroVideoId) initHeroPlayer();
        }

        function extraireIdYoutube(url) {
            const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([^&]{11})/);
            return match ? match[1] : null;
        }

        async function initialiserPage() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (user) {
                const { data: profil } = await supabaseClient.from('profils').select('plan').eq('id', user.id).single();
                if (profil) profilActuel = profil.plan;
            }

            const { data: medias } = await supabaseClient.from('medias').select('*').order('created_at', { ascending: false });
            
            const videos = medias.filter(m => m.type_media === 'video');
            const podcasts = medias.filter(m => m.type_media === 'podcast');

            /* --- INJECTION VIDÉOS --- */
            if (videos.length > 0) {
                const hero = videos[0];
                heroVideoId = extraireIdYoutube(hero.url_media);
                
                document.getElementById('hero-container').innerHTML = `
                    <div class="hero-banner" data-access="${hero.niveau_acces}" id="hero-box">
                        <div class="yt-wrapper">
                            <div id="yt-hero"></div>
                            <div class="yt-shield" id="yt-shield-hero" onclick="toggleYouTube('hero')">
                                <div class="yt-play-btn" id="yt-play-btn-hero">▶</div>
                            </div>
                        </div>
                        <div class="hero-overlay"></div>
                        <div class="hero-content">
                            <span class="badge-acces badge-${hero.niveau_acces === 'premium' ? 'premium' : 'classic'}">Nouveau - ${hero.niveau_acces}</span>
                            <h1 class="hero-title">${hero.titre}</h1>
                            <p class="hero-desc">${hero.description}</p>
                        </div>
                    </div>`;

                if (window.YT && window.YT.Player) initHeroPlayer();

                let replaysHTML = '';
                replayVideos = videos.slice(1);
                replayVideos.forEach(v => {
                    const yId = extraireIdYoutube(v.url_media);
                    const thumb = yId ? `https://img.youtube.com/vi/${yId}/maxresdefault.jpg` : '';
                    replaysHTML += `
                        <div class="thumbnail-card" onclick="ouvrirReplay('${yId}', '${v.niveau_acces}')">
                            <div class="thumb-img" style="background-image: url('${thumb}')">
                                <span style="position:absolute; top:10px; left:10px;" class="badge-acces badge-${v.niveau_acces === 'premium' ? 'premium' : 'classic'}">${v.niveau_acces}</span>
                            </div>
                            <div class="thumb-info">
                                <div class="thumb-title">${v.titre}</div>
                            </div>
                        </div>`;
                });
                document.getElementById('replays-container').innerHTML = replaysHTML || '<p class="loading-text">Aucun replay.</p>';
            }

            /* --- INJECTION PODCASTS --- */
            let podcastsHTML = '';
            podcasts.forEach((p, index) => {
                podcastsHTML += `
                <div class="podcast-card" data-access="${p.niveau_acces}">
                    <button class="pod-play-btn">▶</button>
                    <div class="pod-content">
                        <span class="badge-acces badge-${p.niveau_acces === 'premium' ? 'premium' : 'classic'}" style="margin-bottom:5px;">${p.niveau_acces}</span>
                        <div class="pod-title">${p.titre}</div>
                        <div class="progress-container">
                            <input type="range" class="pod-progress" value="0" min="0" max="100" step="0.1">
                            <div class="time-display">0:00</div>
                        </div>
                    </div>
                    <audio class="elite-audio" src="${p.url_media}"></audio>
                </div>`;
            });
            document.getElementById('podcasts-container').innerHTML = podcastsHTML || '<p class="loading-text">Aucun podcast.</p>';
            configurerLecteursAudio();
        }

        /* --- LOGIQUE YOUTUBE HERO --- */
        function initHeroPlayer() {
            ytPlayers['hero'] = new YT.Player('yt-hero', {
                videoId: heroVideoId,
                playerVars: { 'controls': 0, 'disablekb': 1, 'fs': 0, 'modestbranding': 1, 'rel': 0 },
                events: { 'onStateChange': (e) => onPlayerStateChange(e, 'hero') }
            });
        }

        /* --- LOGIQUE YOUTUBE REPLAY (MODAL) --- */
        function ouvrirReplay(videoId, acces) {
            document.getElementById('replay-modal').style.display = 'flex';
            document.getElementById('replay-player-box').setAttribute('data-access', acces);
            
            if(ytPlayers['replay']) {
                ytPlayers['replay'].loadVideoById(videoId);
                ytPlayers['replay'].pauseVideo();
            } else {
                ytPlayers['replay'] = new YT.Player('yt-replay', {
                    videoId: videoId,
                    playerVars: { 'controls': 0, 'disablekb': 1, 'fs': 0, 'modestbranding': 1, 'rel': 0 },
                    events: { 'onStateChange': (e) => onPlayerStateChange(e, 'replay') }
                });
            }
        }
        function fermerReplay() {
            document.getElementById('replay-modal').style.display = 'none';
            if(ytPlayers['replay']) ytPlayers['replay'].stopVideo();
        }

        function toggleYouTube(id) {
            let player = ytPlayers[id];
            if (!player) return;
            if (player.getPlayerState() === 1) player.pauseVideo(); else player.playVideo();
        }

        function onPlayerStateChange(event, id) {
            const playBtn = document.getElementById('yt-play-btn-' + id);
            const shield = document.getElementById('yt-shield-' + id);
            if (!playBtn) return;
            if (event.data === 1) { playBtn.style.display = 'none'; shield.style.background = 'transparent'; } 
            else { playBtn.style.display = 'flex'; playBtn.innerHTML = '▶'; shield.style.background = 'rgba(0,0,0,0.3)'; }
        }

        /* Vérification du temps YouTube (Hero & Replay) */
        setInterval(() => {
            ['hero', 'replay'].forEach(id => {
                let player = ytPlayers[id];
                if (player && player.getCurrentTime && player.getPlayerState() === 1) {
                    let time = player.getCurrentTime();
                    let box = id === 'hero' ? document.getElementById('hero-box') : document.getElementById('replay-player-box');
                    let accesRequis = box.getAttribute('data-access');
                    
                    if ((profilActuel === 'none' || profilActuel === 'free') && time >= 60) bloquerLecteur('yt', id, "Temps gratuit écoulé.", accesRequis);
                    else if (profilActuel === 'classic' && accesRequis === 'premium' && time >= 60) bloquerLecteur('yt', id, "Exclusivité Premium.", accesRequis);
                }
            });
        }, 1000);

        /* --- LOGIQUE PODCASTS --- */
        function configurerLecteursAudio() {
            document.querySelectorAll('.podcast-card').forEach(card => {
                const audio = card.querySelector('audio');
                const playBtn = card.querySelector('.pod-play-btn');
                const progress = card.querySelector('.pod-progress');
                const timeDisp = card.querySelector('.time-display');
                const accesRequis = card.getAttribute('data-access');

                playBtn.onclick = () => {
                    // Stoppe les autres
                    document.querySelectorAll('audio').forEach(a => { if(a !== audio) { a.pause(); a.parentElement.querySelector('.pod-play-btn').innerHTML = '▶'; } });
                    if(audio.paused) audio.play(); else audio.pause();
                };

                audio.onplay = () => playBtn.innerHTML = '⏸';
                audio.onpause = () => playBtn.innerHTML = '▶';

                audio.ontimeupdate = () => {
                    if (audio.duration) { progress.value = (audio.currentTime / audio.duration) * 100; timeDisp.textContent = formatTime(audio.currentTime); }
                    if ((profilActuel === 'none' || profilActuel === 'free') && audio.currentTime >= 60) bloquerLecteur('audio', audio, "Fin de l'extrait gratuit.", accesRequis);
                    else if (profilActuel === 'classic' && accesRequis === 'premium' && audio.currentTime >= 60) bloquerLecteur('audio', audio, "Exclusivité Premium.", accesRequis);
                };
                progress.oninput = () => { if (audio.duration) audio.currentTime = (progress.value / 100) * audio.duration; };
            });
        }
        function formatTime(s) { return Math.floor(s/60) + ':' + (Math.floor(s%60) < 10 ? '0' : '') + Math.floor(s%60); }

        /* --- MODAL BLOCAGE --- */
        function bloquerLecteur(type, cible, message, planRequis) {
            lecteurBloqueActuel = { type, cible };
            if (type === 'yt') { ytPlayers[cible].pauseVideo(); ytPlayers[cible].seekTo(59.5); } 
            else { cible.pause(); cible.currentTime = 59.5; }
            
            document.getElementById('upgrade-title').innerHTML = `Élite <span style='color: ${planRequis === 'premium' ? 'var(--accent)' : '#0055ff'}'>${planRequis}</span>`;
            document.getElementById('upgrade-message').textContent = message;
            const modal = document.getElementById('upgrade-modal');
            modal.style.display = 'flex'; setTimeout(() => modal.classList.add('show'), 10);
        }

        function fermerModal() {
            const modal = document.getElementById('upgrade-modal');
            modal.classList.remove('show');
            setTimeout(() => {
                modal.style.display = 'none';
                if (lecteurBloqueActuel) {
                    if (lecteurBloqueActuel.type === 'yt') ytPlayers[lecteurBloqueActuel.cible].seekTo(0);
                    else lecteurBloqueActuel.cible.currentTime = 0;
                }
            }, 400); 
        }

        initialiserPage();
    </script>
</body>
</html>
