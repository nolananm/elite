<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Émissions & Podcasts - Élite</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-dark: #07080b; --bg-card: #12151c; --accent: #e50046; --text-main: #ffffff; --text-muted: #8b92a5; --gradient: linear-gradient(135deg, #e50046, #8000ff); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: radial-gradient(circle at top left, rgba(229, 0, 70, 0.1), transparent 50%), var(--bg-dark); color: var(--text-main); min-height: 100vh; overflow-x: hidden; visibility: hidden; opacity: 0; transition: opacity 0.5s ease; }
        a { text-decoration: none; color: inherit; }

        header { position: fixed; top: 0; width: 100%; padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; background: rgba(7, 8, 11, 0.95); z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .logo { font-size: 28px; font-weight: 800; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 2px; }
        nav { display: flex; gap: 30px; align-items: center; }
        nav a { font-weight: 600; font-size: 14px; text-transform: uppercase; transition: color 0.3s; }
        nav a:hover { color: var(--accent); }

        .container { max-width: 1200px; margin: 120px auto 50px auto; padding: 0 20px; }
        .page-header { text-align: center; margin-bottom: 50px; }
        .page-header h1 { font-size: 44px; font-weight: 800; text-transform: uppercase; margin-bottom: 10px; }
        .page-header p { color: var(--text-muted); font-size: 18px; }

        .ad-zone { display: none; background: rgba(255,255,255,0.02); border: 1px dashed rgba(255,255,255,0.1); border-radius: 12px; padding: 10px; text-align: center; margin: 0 auto 40px auto; overflow: hidden; justify-content: center; align-items: center; flex-direction: column; min-height: 90px; max-width: 900px; position: relative;}
        .ad-label { position: absolute; top: 5px; left: 10px; font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

        .medias-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; }
        .media-card { background: var(--bg-card); border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; cursor: pointer; display: flex; flex-direction: column; position: relative;}
        .media-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0,0,0,0.5); border-color: rgba(229,0,70,0.3); }
        
        .media-icon-area { width: 100%; height: 180px; background: linear-gradient(135deg, rgba(229,0,70,0.1), rgba(128,0,255,0.1)); display: flex; justify-content: center; align-items: center; font-size: 50px; position: relative; }
        .badge-acces { position: absolute; top: 15px; left: 15px; font-size: 11px; font-weight: 800; padding: 6px 14px; border-radius: 6px; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 2;}
        .badge-free { background: #222; color: white; border: 1px solid rgba(255,255,255,0.2); }
        .badge-classic { background: #0055ff; color: white; }
        .badge-premium { background: var(--gradient); color: white; }

        .media-content { padding: 25px; flex: 1; display: flex; flex-direction: column; }
        .media-type { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; font-weight: 800; text-transform: uppercase; }
        .media-title { font-size: 20px; font-weight: 700; line-height: 1.3; margin-bottom: 15px; }
        .media-desc { font-size: 14px; color: var(--text-muted); line-height: 1.6; margin-bottom: 20px; }

        /* MODALES LECTURE */
        .site-modal { display: none; position: fixed; inset: 0; background: rgba(5, 7, 12, 0.95); z-index: 3000; justify-content: center; align-items: center; opacity: 0; transition: 0.3s; padding: 20px; }
        .site-modal.show { opacity: 1; }
        .modal-box { background: var(--bg-card); border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 800px; position: relative; overflow: hidden; }
        .btn-close-modal { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.1); border: none; color: white; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-weight: bold; transition: 0.2s; z-index: 10; }
        .btn-close-modal:hover { background: var(--accent); }
        
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; background: #000; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        /* AUDIO PLAYER */
        .audio-wrapper { padding: 50px 30px; text-align: center; }
        .audio-wave { font-size: 60px; margin-bottom: 20px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .audio-status { font-size: 16px; color: var(--accent); font-weight: 800; text-transform: uppercase; margin-bottom: 20px; letter-spacing: 2px; }
        audio { width: 100%; outline: none; border-radius: 30px; }

        /* PAYWALL MODAL */
        .premium-box { max-width: 480px; text-align: center; padding: 40px; background: linear-gradient(145deg, #161a25, #0f111a); border-radius: 24px; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 30px 60px rgba(0,0,0,0.8); }
        .btn-upgrade { display: inline-block; width: 100%; padding: 15px; background: var(--gradient); color: white; font-weight: 800; border-radius: 8px; margin-top: 20px; text-transform: uppercase; cursor: pointer; border: none; }

        .loading-text { text-align: center; color: var(--text-muted); font-size: 18px; width: 100%; grid-column: 1/-1; padding: 50px; }

        @media (max-width: 768px) {
            header { flex-direction: column; padding: 15px; gap: 10px; }
            nav { flex-wrap: wrap; justify-content: center; gap: 10px; width: 100%; }
            nav a { font-size: 12px; }
            .container { margin-top: 140px; padding: 0 15px; }
            .page-header h1 { font-size: 32px; }
            .medias-grid { grid-template-columns: 1fr; }
            .ad-zone { max-width: 100vw; overflow-x: auto; padding: 10px 0; border-radius: 0; border-left: none; border-right: none;}
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">ÉLITE</a>
        <nav>
            <a href="articles.html">Articles</a>
            <a href="matchs.html">Matchs & Fan Zone</a>
            <a href="medias.html" style="color: var(--accent);">Émissions & Podcasts</a>
            <a href="compte.html">Compte</a>
        </nav>
    </header>

    <div class="container">
        <div class="page-header">
            <h1>Médias Élite</h1>
            <p>Vidéos exclusives et podcasts de la rédaction.</p>
        </div>

        <div class="ad-zone">
            <span class="ad-label">Sponsorisé</span>
            <script>
                atOptions = { 'key' : 'a75626ad776c3791da4b7e1f47f54670', 'format' : 'iframe', 'height' : 90, 'width' : 728, 'params' : {} };
            </script>
            <script src="https://www.highrevenueformat.com/a75626ad776c3791da4b7e1f47f54670/invoke.js"></script>
        </div>

        <div class="medias-grid" id="medias-container">
            <div class="loading-text">Recherche des médias...</div>
        </div>
    </div>

    <!-- MODAL VIDEO -->
    <div class="site-modal" id="modal-video">
        <div class="modal-box">
            <button class="btn-close-modal" onclick="fermerMedia()">✕</button>
            <div id="video-content"></div>
        </div>
    </div>

    <!-- MODAL AUDIO -->
    <div class="site-modal" id="modal-audio">
        <div class="modal-box audio-wrapper">
            <button class="btn-close-modal" onclick="fermerMedia()">✕</button>
            <div class="audio-wave">🎙️</div>
            <div class="audio-status" id="audio-status-text">Préparation...</div>
            <h3 id="audio-title" style="margin-bottom: 30px;">Titre</h3>
            <audio id="audio-player" controls controlsList="nodownload"></audio>
        </div>
    </div>

    <!-- MODAL PAYWALL -->
    <div class="site-modal" id="modal-paywall">
        <div class="modal-box premium-box">
            <button class="btn-close-modal" onclick="fermerMedia()">✕</button>
            <div class="icon" style="font-size: 40px; margin-bottom: 20px;">🔒</div>
            <h2 id="paywall-title" style="margin-bottom: 10px; font-weight: 800; font-size: 24px;">Abonnement Requis</h2>
            <p id="paywall-message" style="color: var(--text-muted); font-size: 14px;">Ce contenu est réservé aux abonnés de niveau supérieur.</p>
            <a href="index.html#abonnements" class="btn-upgrade">Voir les offres</a>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://dmfbjpotgicqpfxlsycv.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRtZmJqcG90Z2ljcXBmeGxzeWN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NDIyNjYsImV4cCI6MjEwMzMxODI2Nn0.WbVuFOdEEaWGSrn3hb8hHLi9Tvzw8AHotc42Q7XH1JE';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let profilActuel = 'none'; 
        let tousLesMedias = [];
        const JINGLE_URL = 'https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3'; // Jingle libre de droit (News Intro)

        async function verifierCompteARebours(estAdmin) {
            const { data } = await supabaseClient.from('reglages_site').select('*').eq('id', 1).single();
            if (data && data.compte_a_rebours_actif && !estAdmin) {
                document.body.innerHTML = `<div style="height:100vh; display:flex; justify-content:center; align-items:center; background:#07080b; color:white;"><h1>L'Élite arrive bientôt...</h1></div>`;
                document.body.style.visibility = 'visible'; document.body.style.opacity = '1';
                return true; 
            }
            return false;
        }

        async function initialiserPage() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            let estAdmin = false;

            if (user) {
                const { data: profil } = await supabaseClient.from('profils').select('plan, est_admin').eq('id', user.id).single();
                if (profil) { profilActuel = profil.plan; estAdmin = profil.est_admin; }
            }

            if (await verifierCompteARebours(estAdmin)) return;

            document.body.style.visibility = 'visible';
            document.body.style.opacity = '1';

            if (profilActuel === 'premium') { document.querySelectorAll('.ad-zone').forEach(zone => zone.remove()); } 
            else { document.querySelectorAll('.ad-zone').forEach(zone => zone.style.display = 'flex'); }

            const { data: medias, error } = await supabaseClient.from('medias').select('*').order('created_at', { ascending: false });
            const container = document.getElementById('medias-container');

            if (error || !medias || medias.length === 0) {
                container.innerHTML = '<div class="loading-text">Aucun média pour le moment.</div>';
                return;
            }

            tousLesMedias = medias;
            let html = '';

            tousLesMedias.forEach(m => {
                let badgeClass = m.niveau_acces === 'premium' ? 'badge-premium' : (m.niveau_acces === 'classic' ? 'badge-classic' : 'badge-free');
                let icone = m.type_media === 'video' ? '📺' : '🎧';
                let libelleType = m.type_media === 'video' ? 'Vidéo' : 'Podcast Audio';

                html += `
                <div class="media-card" onclick="ouvrirMedia('${m.id}')">
                    <div class="media-icon-area">
                        <span class="badge-acces ${badgeClass}">${m.niveau_acces || 'free'}</span>
                        ${icone}
                    </div>
                    <div class="media-content">
                        <div class="media-type">${libelleType}</div>
                        <div class="media-title">${m.titre}</div>
                        <div class="media-desc">${m.description || ''}</div>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        function ouvrirMedia(idMedia) {
            const media = tousLesMedias.find(m => m.id == idMedia);
            if (!media) return;

            const accesRequis = media.niveau_acces || 'free';
            let aLeDroit = false;
            if (accesRequis === 'free') aLeDroit = true;
            else if (accesRequis === 'classic' && (profilActuel === 'classic' || profilActuel === 'premium')) aLeDroit = true;
            else if (accesRequis === 'premium' && profilActuel === 'premium') aLeDroit = true;

            if (!aLeDroit) {
                document.getElementById('paywall-title').innerHTML = `Élite <span style='color: var(--accent)'>${accesRequis.toUpperCase()}</span>`;
                const modal = document.getElementById('modal-paywall'); modal.style.display = 'flex'; setTimeout(() => { modal.classList.add('show'); }, 10);
                return;
            }

            if (media.type_media === 'video') {
                let embedUrl = media.url_media.replace("watch?v=", "embed/").replace("youtu.be/", "www.youtube.com/embed/");
                document.getElementById('video-content').innerHTML = `<div class="video-container"><iframe src="${embedUrl}?autoplay=1" allow="autoplay; fullscreen"></iframe></div>`;
                const modal = document.getElementById('modal-video'); modal.style.display = 'flex'; setTimeout(() => { modal.classList.add('show'); }, 10);
            } 
            else if (media.type_media === 'podcast') {
                document.getElementById('audio-title').innerText = media.titre;
                const audioPlayer = document.getElementById('audio-player');
                const statusText = document.getElementById('audio-status-text');
                
                // LE JINGLE MAGIQUE EST ICI
                statusText.innerText = "Jingle Élite en cours...";
                statusText.style.color = "white";
                audioPlayer.src = JINGLE_URL;
                
                // On essaie de lancer le jingle tout de suite
                audioPlayer.play().catch(e => console.log("L'utilisateur doit interagir avant de lancer l'audio."));
                
                // Quand le jingle finit, on lance le vrai podcast
                audioPlayer.onended = function() {
                    statusText.innerText = "▶ Lecture du Podcast";
                    statusText.style.color = "var(--accent)";
                    audioPlayer.src = media.url_media;
                    audioPlayer.play();
                    audioPlayer.onended = null; // On enlève la boucle
                };

                const modal = document.getElementById('modal-audio'); modal.style.display = 'flex'; setTimeout(() => { modal.classList.add('show'); }, 10);
            }
        }

        function fermerMedia() {
            document.querySelectorAll('.site-modal').forEach(m => {
                m.classList.remove('show');
                setTimeout(() => { m.style.display = 'none'; }, 300);
            });
            document.getElementById('video-content').innerHTML = '';
            
            const audioPlayer = document.getElementById('audio-player');
            audioPlayer.pause();
            audioPlayer.src = "";
            audioPlayer.onended = null;
        }

        initialiserPage();
    </script>
</body>
</html>
