<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Élite</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-dark: #0a0b10; --bg-card: #151821; --accent: #e50046; --text-main: #ffffff; --text-muted: #9ba1a6; --gradient: linear-gradient(135deg, #e50046, #8000ff); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; justify-content: center; padding: 40px 20px; }
        .admin-container { background: var(--bg-card); padding: 40px; border-radius: 20px; width: 100%; max-width: 700px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .admin-container h2 { text-align: center; margin-bottom: 25px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .tabs { display: flex; margin-bottom: 30px; border-bottom: 2px solid rgba(255,255,255,0.1); }
        .tab { flex: 1; text-align: center; padding: 12px; cursor: pointer; color: var(--text-muted); font-weight: 600; transition: 0.3s; position: relative; }
        .tab:hover, .tab.active { color: white; }
        .tab.active::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 100%; height: 3px; background: var(--gradient); border-radius: 3px; }
        
        label { display: block; margin-top: 15px; margin-bottom: 5px; font-size: 14px; font-weight: 600; color: var(--text-muted); }
        input, select, textarea { width: 100%; padding: 15px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 8px; outline: none; transition: 0.3s; }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); background: rgba(255,255,255,0.05); }
        textarea { resize: vertical; min-height: 120px; }
        input[type="file"] { padding: 10px; background: rgba(0,0,0,0.2); cursor: pointer; }
        
        button { width: 100%; padding: 15px; background: var(--gradient); color: white; font-weight: bold; border-radius: 8px; font-size: 16px; border: none; cursor: pointer; margin-top: 25px; transition: 0.3s; text-transform: uppercase; }
        button:hover { box-shadow: 0 5px 20px rgba(229, 0, 70, 0.4); transform: translateY(-2px); }
        .message-retour { text-align: center; font-weight: bold; margin-top: 15px; min-height: 20px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="admin-container" id="admin-content" style="display: none;">
        <h2>🛠️ Panel de Gestion</h2>
        
        <div class="tabs">
            <div class="tab active" id="tab-match" onclick="changerOnglet('match')">⚽ Matchs</div>
            <div class="tab" id="tab-media" onclick="changerOnglet('media')">🎙️ Médias</div>
            <div class="tab" id="tab-article" onclick="changerOnglet('article')">📝 Articles</div>
        </div>

        <!-- ONGLETS MATCHS ET MEDIAS (Masqués ici pour gagner de la place, mais toujours fonctionnels) -->
        <div id="form-match">
            <label>Équipe Domicile :</label><input type="text" id="equipe-dom">
            <label>Équipe Extérieur :</label><input type="text" id="equipe-ext">
            <div style="display: flex; gap: 15px;">
                <div style="flex: 1;"><label>Score Dom :</label><input type="number" id="score-dom" value="0"></div>
                <div style="flex: 1;"><label>Score Ext :</label><input type="number" id="score-ext" value="0"></div>
            </div>
            <label>Accès :</label>
            <select id="niveau-acces-match">
                <option value="free">Free</option><option value="classic" selected>Classic</option><option value="premium">Premium</option>
            </select>
            <button onclick="ajouterMatch()">Publier le match</button>
            <p class="message-retour" id="msg-match"></p>
        </div>

        <div id="form-media" style="display: none;">
            <label>Type :</label>
            <select id="type-media" onchange="adapterFormulaire()">
                <option value="video">📺 Élite Le Mag (Vidéo YouTube)</option>
                <option value="podcast">🎙️ Élite Décrypte (Upload Audio)</option>
            </select>
            <label>Titre :</label><input type="text" id="titre-media">
            <label>Description :</label><textarea id="desc-media"></textarea>
            
            <div id="zone-url"><label>Lien YouTube :</label><input type="text" id="url-media"></div>
            <div id="zone-upload" style="display: none;"><label>Fichier Audio (MP3) :</label><input type="file" id="file-media" accept="audio/*"></div>

            <label>Accès :</label>
            <select id="niveau-acces-media">
                <option value="classic" selected>Classic</option><option value="premium">Premium</option>
            </select>
            <button onclick="ajouterMedia()">Publier l'épisode</button>
            <p class="message-retour" id="msg-media"></p>
        </div>

        <!-- NOUVEL ONGLET : ARTICLES -->
        <div id="form-article" style="display: none;">
            <label>Titre de l'article :</label>
            <input type="text" id="titre-article" placeholder="Ex: Pourquoi le PSG a raté son mercato">
            
            <label>Lien de l'image de couverture (URL) :</label>
            <input type="text" id="image-article" placeholder="https://lien-vers-une-photo.jpg">
            
            <label>Contenu de l'article :</label>
            <textarea id="contenu-article" style="height: 300px;" placeholder="Écris ton article ici... (Les retours à la ligne seront respectés)"></textarea>
            
            <label>Niveau d'accès :</label>
            <select id="niveau-acces-article">
                <option value="free">🟢 Free (Gratuit pour tous)</option>
                <option value="classic">🔵 Classic (Abonnés Standard)</option>
                <option value="premium">🟣 Premium (Exclusivité Absolue)</option>
            </select>
            
            <button onclick="ajouterArticle()">Publier l'article</button>
            <p class="message-retour" id="msg-article"></p>
        </div>

    </div>
    
    <script>
        const supabaseUrl = 'https://dmfbjpotgicqpfxlsycv.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRtZmJqcG90Z2ljcXBmeGxzeWN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NDIyNjYsImV4cCI6MjEwMzMxODI2Nn0.WbVuFOdEEaWGSrn3hb8hHLi9Tvzw8AHotc42Q7XH1JE';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        async function verifierAdmin() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) return window.location.href = 'compte.html';
            const { data: p } = await supabaseClient.from('profils').select('est_admin').eq('id', user.id).single();
            if (p?.est_admin) document.getElementById('admin-content').style.display = "block";
            else window.location.href = 'index.html';
        }

        function changerOnglet(onglet) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('div[id^="form-"]').forEach(f => f.style.display = 'none');
            document.getElementById('tab-' + onglet).classList.add('active');
            document.getElementById('form-' + onglet).style.display = 'block';
        }

        function adapterFormulaire() {
            const type = document.getElementById('type-media').value;
            document.getElementById('zone-url').style.display = type === 'video' ? 'block' : 'none';
            document.getElementById('zone-upload').style.display = type === 'podcast' ? 'block' : 'none';
        }

        async function ajouterMatch() {
            /* ... (Code existant pour les matchs) ... */
            const eqDom = document.getElementById('equipe-dom').value, eqExt = document.getElementById('equipe-ext').value, scoreDom = parseInt(document.getElementById('score-dom').value), scoreExt = parseInt(document.getElementById('score-ext').value), acces = document.getElementById('niveau-acces-match').value, msg = document.getElementById('msg-match');
            msg.textContent = "Envoi..."; msg.style.color = "white";
            const { error } = await supabaseClient.from('matchs').insert([{ equipe_domicile: eqDom, equipe_exterieur: eqExt, score_domicile: scoreDom, score_exterieur: scoreExt, niveau_acces: acces, date_match: new Date().toISOString() }]);
            if (error) { msg.textContent = "❌ Erreur"; msg.style.color = "red"; } else { msg.textContent = "✅ Validé !"; msg.style.color = "green"; }
        }

        async function ajouterMedia() {
            /* ... (Code existant pour les médias) ... */
            const type = document.getElementById('type-media').value, titre = document.getElementById('titre-media').value, desc = document.getElementById('desc-media').value, acces = document.getElementById('niveau-acces-media').value, msg = document.getElementById('msg-media');
            let urlFinale = ""; msg.textContent = "Traitement en cours..."; msg.style.color = "white";
            if (type === 'video') {
                urlFinale = document.getElementById('url-media').value;
                if(!urlFinale) return msg.textContent = "❌ L'URL YouTube est requise.", msg.style.color = "red";
            } else {
                const fileInput = document.getElementById('file-media');
                if(!fileInput.files || fileInput.files.length === 0) return msg.textContent = "❌ Sélectionne un fichier audio.", msg.style.color = "red";
                const file = fileInput.files[0];
                const nomFichier = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.\-_]/g, '')}`;
                const { data: uploadData, error: uploadError } = await supabaseClient.storage.from('podcasts').upload(nomFichier, file);
                if (uploadError) return msg.textContent = "❌ Erreur upload: " + uploadError.message, msg.style.color = "red";
                urlFinale = supabaseClient.storage.from('podcasts').getPublicUrl(uploadData.path).data.publicUrl;
            }
            const { error } = await supabaseClient.from('medias').insert([{ type_media: type, titre: titre, description: desc, url_media: urlFinale, niveau_acces: acces }]);
            if (error) { msg.textContent = "❌ Erreur"; msg.style.color = "red"; } else { msg.textContent = "✅ Épisode en ligne !"; msg.style.color = "green"; }
        }

        // FONCTION POUR AJOUTER UN ARTICLE
        async function ajouterArticle() {
            const titre = document.getElementById('titre-article').value;
            const image = document.getElementById('image-article').value;
            const contenu = document.getElementById('contenu-article').value;
            const acces = document.getElementById('niveau-acces-article').value;
            const msg = document.getElementById('msg-article');

            if(!titre || !contenu) {
                msg.textContent = "❌ Le titre et le contenu sont obligatoires."; msg.style.color = "red";
                return;
            }

            msg.textContent = "Publication en cours..."; msg.style.color = "white";

            const { error } = await supabaseClient.from('articles').insert([
                { titre: titre, image_url: image, contenu: contenu, niveau_acces: acces }
            ]);

            if (error) {
                msg.textContent = "❌ Erreur lors de la publication : " + error.message; msg.style.color = "red";
            } else {
                msg.textContent = "✅ Article publié avec succès !"; msg.style.color = "#00e676";
                document.getElementById('titre-article').value = "";
                document.getElementById('image-article').value = "";
                document.getElementById('contenu-article').value = "";
            }
        }

        verifierAdmin();
    </script>
</body>
</html>
