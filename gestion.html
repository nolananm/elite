<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Élite</title>
    <!-- Importation de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; }
        .admin-box { background: white; padding: 20px; border-radius: 8px; max-width: 500px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin: 0 auto; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #e50046; color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background-color: #c4003c; }
        #message-retour { text-align: center; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="admin-box">
        <h2>🛠️ Panel de Gestion - Ajouter un match</h2>
        
        <label>Équipe à domicile :</label>
        <input type="text" id="equipe-dom" placeholder="Ex: Paris Saint-Germain">
        
        <label>Équipe à l'extérieur :</label>
        <input type="text" id="equipe-ext" placeholder="Ex: Olympique de Marseille">
        
        <label>Score Domicile :</label>
        <input type="number" id="score-dom" placeholder="0" value="0">
        
        <label>Score Extérieur :</label>
        <input type="number" id="score-ext" placeholder="0" value="0">

        <label>Accès requis :</label>
        <select id="niveau-acces">
            <option value="free">Free (Match du dimanche 17h15)</option>
            <option value="classic" selected>Classic (Standard)</option>
            <option value="premium">Premium</option>
        </select>

        <button onclick="ajouterMatch()">Publier le match</button>
        <p id="message-retour"></p>
    </div>
    
    <!-- Le script "Tout-en-un" avec tes identifiants -->
    <script>
        // 1. Tes identifiants Supabase
        const supabaseUrl = 'https://dmfbjpotgicqpfxlsycv.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRtZmJqcG90Z2ljcXBmeGxzeWN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NDIyNjYsImV4cCI6MjEwMzMxODI2Nn0.WbVuFOdEEaWGSrn3hb8hHLi9Tvzw8AHotc42Q7XH1JE';
        
        // 2. Initialisation de la connexion (Syntaxe corrigée)
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        // 3. Fonction pour envoyer les données
        async function ajouterMatch() {
            const eqDom = document.getElementById('equipe-dom').value;
            const eqExt = document.getElementById('equipe-ext').value;
            const scoreDom = parseInt(document.getElementById('score-dom').value);
            const scoreExt = parseInt(document.getElementById('score-ext').value);
            const acces = document.getElementById('niveau-acces').value;
            const message = document.getElementById('message-retour');

            message.textContent = "Envoi en cours...";
            message.style.color = "black";

            // Envoi vers Supabase
            const { data, error } = await supabaseClient
                .from('matchs')
                .insert([
                    { 
                        equipe_domicile: eqDom, 
                        equipe_exterieur: eqExt, 
                        score_domicile: scoreDom, 
                        score_exterieur: scoreExt,
                        niveau_acces: acces,
                        date_match: new Date().toISOString()
                    }
                ]);

            if (error) {
                message.textContent = "❌ Erreur : " + error.message;
                message.style.color = "red";
                console.error("Erreur détaillée :", error);
            } else {
                message.textContent = "✅ Match ajouté avec succès !";
                message.style.color = "green";
                // On vide les cases pour le prochain match
                document.getElementById('equipe-dom').value = "";
                document.getElementById('equipe-ext').value = "";
                document.getElementById('score-dom').value = "0";
                document.getElementById('score-ext').value = "0";
            }
        }
    </script>
</body>
</html>
