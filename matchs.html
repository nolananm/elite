<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matchs & Analyses - Élite</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #0a0b10;
            --bg-card: #151821;
            --accent: #e50046;
            --accent-hover: #ff0a5a;
            --text-main: #ffffff;
            --text-muted: #9ba1a6;
            --gradient: linear-gradient(135deg, #e50046, #8000ff);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); overflow-x: hidden; }
        a { text-decoration: none; color: inherit; }

        /* HEADER */
        header {
            position: fixed; top: 0; width: 100%; padding: 20px 50px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(10, 11, 16, 0.9); backdrop-filter: blur(10px);
            z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .logo { font-size: 28px; font-weight: 800; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 2px; }
        nav { display: flex; gap: 30px; align-items: center; }
        nav a { font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; transition: color 0.3s; }
        nav a:hover { color: var(--accent); }
        
        /* CONTENU PRINCIPAL */
        .container { max-width: 1000px; margin: 120px auto 50px auto; padding: 0 20px; }
        
        .page-header { text-align: center; margin-bottom: 50px; }
        .page-header h1 { font-size: 40px; font-weight: 800; text-transform: uppercase; }
        .page-header p { color: var(--text-muted); font-size: 16px; margin-top: 10px; }

        /* LES CARTES DE MATCHS */
        #liste-matchs { display: flex; flex-direction: column; gap: 20px; }
        
        .match-card {
            background: var(--bg-card);
            border-radius: 15px;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }
        .match-card:hover { transform: translateY(-5px); border-color: var(--accent); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* Ligne de gradient sur le côté de la carte */
        .match-card::before { content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 5px; background: var(--gradient); }

        .team { flex: 1; font-size: 24px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .team.away { text-align: right; }
        
        .score-box {
            background: rgba(255,255,255,0.05);
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 32px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .badge-acces {
            position: absolute;
            top: 15px; right: 15px;
            font-size: 10px; font-weight: bold; padding: 4px 10px;
            border-radius: 20px; text-transform: uppercase;
        }
        .badge-free { background: #333; color: white; }
        .badge-classic { background: #0055ff; color: white; }
        .badge-premium { background: var(--gradient); color: white; }

        .btn-analyser {
            display: block; width: 100%; text-align: center;
            background: rgba(255,255,255,0.05); color: white;
            padding: 15px; border-radius: 8px; font-weight: bold;
            margin-top: 15px; transition: 0.3s; cursor: pointer;
        }
        .btn-analyser:hover { background: var(--accent); }

        .loading { text-align: center; color: var(--text-muted); font-size: 18px; padding: 50px; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">ÉLITE</a>
        <nav>
            <a href="#">Articles</a>
            <a href="matchs.html" style="color: var(--accent);">Matchs & Fan Zone</a>
            <a href="#">Élite Le Mag</a>
            <a href="#">Décrypte</a>
            <a href="compte.html">Compte</a>
        </nav>
    </header>

    <div class="container">
        <div class="page-header">
            <h1>Résultats & Analyses</h1>
            <p>Retrouve les scores de la Ligue 1 et rejoins la Fan Zone en direct.</p>
        </div>

        <!-- C'est ici que le JavaScript va injecter les matchs -->
        <div id="liste-matchs">
            <div class="loading">⏳ Chargement des matchs depuis le stade...</div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://dmfbjpotgicqpfxlsycv.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRtZmJqcG90Z2ljcXBmeGxzeWN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3NDIyNjYsImV4cCI6MjEwMzMxODI2Nn0.WbVuFOdEEaWGSrn3hb8hHLi9Tvzw8AHotc42Q7XH1JE';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        async function chargerMatchs() {
            const conteneur = document.getElementById('liste-matchs');

            // On demande à Supabase de nous donner tous les matchs, du plus récent au plus ancien
            const { data: matchs, error } = await supabaseClient
                .from('matchs')
                .select('*')
                .order('date_match', { ascending: false });

            if (error) {
                conteneur.innerHTML = `<p style="color: red; text-align: center;">❌ Erreur lors du chargement des matchs.</p>`;
                console.error(error);
                return;
            }

            if (matchs.length === 0) {
                conteneur.innerHTML = `<p style="text-align: center; color: var(--text-muted);">Aucun match n'a encore été joué.</p>`;
                return;
            }

            // On vide le texte de chargement
            conteneur.innerHTML = '';

            // On boucle sur chaque match pour créer sa carte HTML
            matchs.forEach(match => {
                let badgeClass = 'badge-free';
                if (match.niveau_acces === 'classic') badgeClass = 'badge-classic';
                if (match.niveau_acces === 'premium') badgeClass = 'badge-premium';

                const carte = `
                    <div style="background: var(--bg-card); border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); overflow: hidden; margin-bottom: 20px;">
                        <div class="match-card">
                            <span class="badge-acces ${badgeClass}">${match.niveau_acces}</span>
                            <div class="team">${match.equipe_domicile}</div>
                            <div class="score-box">
                                <span>${match.score_domicile}</span>
                                <span style="color: var(--text-muted); font-size: 20px;">-</span>
                                <span>${match.score_exterieur}</span>
                            </div>
                            <div class="team away">${match.equipe_exterieur}</div>
                        </div>
                        <!-- Le bouton pour aller voir les stats détaillées et la Fan Zone (on le codera juste après) -->
                        <div style="padding: 0 30px 20px 30px;">
                            <a href="#" class="btn-analyser">Voir l'analyse & Fan Zone</a>
                        </div>
                    </div>
                `;
                conteneur.innerHTML += carte;
            });
        }

        // On lance le chargement dès l'ouverture de la page
        chargerMatchs();
    </script>
</body>
</html>
